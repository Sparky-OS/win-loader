Text=VERY IMPORTANT NOTICE:\n\nYou need to reboot in order to proceed with your Debian install.  During your next boot, you will be asked wether you want to start Windows or "Debian Installer".  Choose "Debian Installer" to continue the install process.\n\nDuring the install process, you will be offered the possibility of either reducing your Windows partition to install Debian or completely replacing it.  In both cases, it is STRONGLY RECOMMENDED that you have previously made a backup of your data.  Nor the authors of this loader neither the Debian project will take ANY RESPONSABILITY in the event of data loss.\n\nOnce your Debian install is complete (and if you have chosen to keep Windows in your disk), you can uninstall the Debian-Installer Loader through the Windows Add/Remove Programs dialog in Control Panel.\n\nEnjoy!
